# Dock Mic: the Belkin Thunderbolt 4 dock's headset mic, cleaned up.
# The dock's mic is mono and arrives as the same signal on both "Analog Stereo" channels, so this
# takes one channel and runs it through RNNoise (the same filter as the laptop mic in section 4)
# to remove keyboard clicks and fan noise. The dock has no mic boost; legion-session sets its
# gain (DOCK_GAIN, 170% = +14 dB) whenever the dock connects.
# Needs: sudo pacman -S noise-suppression-for-voice
context.modules = [
{   name = libpipewire-module-filter-chain
    args = {
        node.description = "Dock Mic"
        media.name = "Dock Mic"
        filter.graph = {
            nodes = [
                {
                    type   = ladspa
                    name   = rnnoise
                    plugin = /usr/lib/ladspa/librnnoise_ladspa.so
                    label  = noise_suppressor_mono
                    control = {
                        "VAD Threshold (%)" = 50.0
                        "VAD Grace Period (ms)" = 200
                    }
                }
            ]
        }
        capture.props = {
            node.name = "capture.dock_mic"
            node.passive = true
            target.object = "alsa_input.usb-Generic_USB_Audio-00.analog-stereo"
            node.dont-fallback = true
            audio.rate = 48000
            audio.channels = 1
            audio.position = [ FL ]
        }
        playback.props = {
            node.name = "dock_mic"
            node.description = "Dock Mic"
            media.class = Audio/Source
            audio.rate = 48000
            audio.channels = 1
            audio.position = [ MONO ]
        }
    }
}
]
