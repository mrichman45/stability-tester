# Gentoo's official binary packages, built for x86-64-v3 CPUs (the Legion's i9 qualifies).
# Replaces the x86-64 file the stage3 ships with. A closer mirror works too: keep the
# path from /releases/ onwards.
[gentoobinhost]
priority = 9999
sync-uri = https://distfiles.gentoo.org/releases/amd64/binpackages/23.0/x86-64-v3/
