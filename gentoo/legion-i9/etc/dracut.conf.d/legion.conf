# dracut builds the unified kernel image (kernel + initramfs + command line in one
# .efi file) and signs it with your Secure Boot db key, so the firmware accepts it.
uefi_secureboot_cert="/var/lib/sbctl/keys/db/db.pem"
uefi_secureboot_key="/var/lib/sbctl/keys/db/db.key"

# The root filesystem is Btrfs.
add_dracutmodules+=" btrfs "

# The desktop runs on the Intel GPU; the NVIDIA driver loads later, from the system.
omit_drivers+=" nvidia nvidia_drm nvidia_modeset nvidia_uvm "

compress="zstd"
