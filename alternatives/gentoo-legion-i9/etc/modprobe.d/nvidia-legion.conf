# RTX 4090 Laptop GPU on a hybrid (Intel + NVIDIA) laptop.
# modeset/fbdev: needed for Wayland. DynamicPowerManagement=0x02: let the RTX power
# down completely when nothing uses it (legion-system and the GPU wrappers rely on it).
options nvidia_drm modeset=1 fbdev=1
# PreserveVideoMemoryAllocations: keep the RTX's memory across sleep and hibernation
# (with the nvidia-suspend, -hibernate and -resume services, turned on by 3-desktop.sh).
options nvidia NVreg_DynamicPowerManagement=0x02 NVreg_PreserveVideoMemoryAllocations=1
