# /etc/portage/make.conf for the Legion i9 (Gentoo, systemd, KDE Plasma).
# Installed by 1-live-usb.sh. Explained in the Gentoo guide, phase 2.

# Build for this exact CPU. Binary packages from Gentoo's x86-64-v3 host are used
# whenever their USE flags match; anything else compiles with these flags.
COMMON_FLAGS="-march=native -O2 -pipe"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"

# 32 GB of RAM: about 2 GB per compile job, so 16 jobs. The load limit keeps the
# desktop usable while something builds.
MAKEOPTS="-j16 -l24"

# Download signed binary packages where they exist; build the rest.
EMERGE_DEFAULT_OPTS="--getbinpkg --with-bdeps=y --quiet-build=y"
FEATURES="binpkg-request-signature parallel-fetch"

# dist-kernel: rebuild NVIDIA and the Legion module when the kernel changes.
# -flatpak: no Flatpak support built into anything.
USE="dist-kernel -flatpak"

VIDEO_CARDS="intel nvidia"
INPUT_DEVICES="libinput"
L10N="en ja"

# Personal machine: accept every licence (NVIDIA, Steam, firmware, Vivaldi,
# Microsoft fonts). Use "-* @FREE @BINARY-REDISTRIBUTABLE" to be strict instead.
ACCEPT_LICENSE="*"

# Secure Boot: the kernel and systemd-boot are signed with your existing sbctl
# keys (copied from CachyOS), and kernel modules with a key made on this laptop.
SECUREBOOT_SIGN_KEY="/var/lib/sbctl/keys/db/db.key"
SECUREBOOT_SIGN_CERT="/var/lib/sbctl/keys/db/db.pem"
MODULES_SIGN_KEY="/etc/portage/keys/modules.pem"
MODULES_SIGN_CERT="/etc/portage/keys/modules.pem"
MODULES_SIGN_HASH="sha512"

LC_MESSAGES=C.utf8
